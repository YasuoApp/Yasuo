<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Yasu — Yasuo's mascot</title>
  <!--
    Drawn by hand rather than exported, for the reason tray-icon.mjs is: a
    drawing anybody can diff is one anybody can change.

    The ears are the app icon's Y — the left arm lighter and the right one
    darker, the fold of the ribbon in the mark — and the bubbles around the head
    are the several conversations the app holds open at once, in the studio's
    own section hues. The white bubble carries an outline because the Dock and a
    browser tab are both light somewhere, and white on white is no bubble.

    resources/icon-source.png and src/renderer/public/favicon.ico are renders of
    this file without the glow behind it; `make icon` takes it from there.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="0.55" stop-color="#5B3FE8"/>
      <stop offset="1" stop-color="#3A22B8"/>
    </linearGradient>
    <linearGradient id="earFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9F86FF"/>
      <stop offset="1" stop-color="#6A4DF0"/>
    </linearGradient>
    <linearGradient id="earBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D52F2"/>
      <stop offset="1" stop-color="#3F27C4"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E0FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="280" r="240" fill="url(#glow)"/>
  <ellipse cx="256" cy="458" rx="120" ry="14" fill="#1B1640" opacity="0.25"/>

  <!-- Ears: the Y. -->
  <g transform="rotate(30 316 200)">
    <rect x="279" y="58" width="74" height="180" rx="37" fill="url(#earBack)"/>
    <rect x="299" y="84" width="34" height="110" rx="17" fill="#B9A8FF" opacity="0.45"/>
  </g>
  <g transform="rotate(-30 196 200)">
    <rect x="159" y="58" width="74" height="180" rx="37" fill="url(#earFront)"/>
    <rect x="179" y="84" width="34" height="110" rx="17" fill="#E4DCFF" opacity="0.6"/>
  </g>

  <!-- Feet, then arms, then the body over both. -->
  <ellipse cx="206" cy="440" rx="34" ry="16" fill="#2E1A9E"/>
  <ellipse cx="306" cy="440" rx="34" ry="16" fill="#2E1A9E"/>
  <ellipse cx="122" cy="340" rx="24" ry="38" fill="#4A30D6" transform="rotate(22 122 340)"/>
  <ellipse cx="390" cy="340" rx="24" ry="38" fill="#4A30D6" transform="rotate(-22 390 340)"/>
  <rect x="116" y="178" width="280" height="264" rx="128" fill="url(#body)"/>
  <ellipse cx="200" cy="222" rx="54" ry="22" fill="#FFFFFF" opacity="0.14" transform="rotate(-18 200 222)"/>

  <!-- Face. -->
  <ellipse cx="256" cy="304" rx="108" ry="84" fill="url(#face)"/>
  <ellipse cx="214" cy="296" rx="23" ry="28" fill="#1B1640"/>
  <ellipse cx="298" cy="296" rx="23" ry="28" fill="#1B1640"/>
  <circle cx="206" cy="285" r="8" fill="#FFFFFF"/>
  <circle cx="290" cy="285" r="8" fill="#FFFFFF"/>
  <circle cx="221" cy="307" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="305" cy="307" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="178" cy="334" rx="15" ry="8" fill="#FF8FB1" opacity="0.55"/>
  <ellipse cx="334" cy="334" rx="15" ry="8" fill="#FF8FB1" opacity="0.55"/>
  <path d="M243 336 Q256 349 269 336" fill="none" stroke="#1B1640" stroke-width="5.5" stroke-linecap="round"/>

  <!-- The prompt on its belly. -->
  <rect x="226" y="398" width="60" height="28" rx="9" fill="#1B1640"/>
  <path d="M238 405 L246 412 L238 419" fill="none" stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="252" y="416" width="20" height="3.5" rx="1.75" fill="#5EEAD4"/>

  <!-- Several conversations at once. -->
  <g>
    <path d="M374 104 h80 a18 18 0 0 1 18 18 v30 a18 18 0 0 1 -18 18 h-52 l-20 16 v-16 h-8 a18 18 0 0 1 -18 -18 v-30 a18 18 0 0 1 18 -18 z" fill="#FFFFFF" stroke="#C9BCFF" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="392" cy="137" r="6" fill="#7C5CFA"/>
    <circle cx="414" cy="137" r="6" fill="#7C5CFA" opacity="0.7"/>
    <circle cx="436" cy="137" r="6" fill="#7C5CFA" opacity="0.4"/>
  </g>
  <g>
    <path d="M52 196 h58 a15 15 0 0 1 15 15 v22 a15 15 0 0 1 -15 15 h-6 v14 l-18 -14 h-34 a15 15 0 0 1 -15 -15 v-22 a15 15 0 0 1 15 -15 z" fill="#5EEAD4"/>
    <rect x="56" y="214" width="46" height="5" rx="2.5" fill="#134E4A" opacity="0.7"/>
    <rect x="56" y="226" width="30" height="5" rx="2.5" fill="#134E4A" opacity="0.45"/>
  </g>
  <g>
    <path d="M422 232 h36 a13 13 0 0 1 13 13 v14 a13 13 0 0 1 -13 13 h-22 l-14 11 v-11 a13 13 0 0 1 -13 -13 v-14 a13 13 0 0 1 13 -13 z" fill="#FBBF24"/>
    <path d="M432 252 l6 6 l12 -12" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
