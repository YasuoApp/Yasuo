name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push or a second push to a PR makes the earlier run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  test:
    name: test (${{ matrix.os }})
    # Visual Studio Claude is developed on macOS, but the main process reaches for ptys, unix
    # sockets and git on every platform it claims to support. Running the suite
    # on Linux too is what keeps "it works on my machine" from being the whole
    # of the Linux story.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      # Bundles the main process, the preload, the daemon and the renderer.
      # Not an installer — packaging is a release concern and needs signing
      # material this workflow deliberately does not have.
      - run: bun run build
